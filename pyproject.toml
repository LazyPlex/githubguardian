[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "githubguardian"
version = "0.6.0"
description = "Open-source defensive security scanner for detecting accidentally exposed secrets in public GitHub repositories."
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[project.scripts]
githubguardian = "guardian.cli:main"

[tool.setuptools.packages.find]
include = ["guardian*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
