[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "githubguardian"
version = "0.1.0"
description = "Open-source security scanner for detecting accidentally exposed secrets in public GitHub repositories."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9"
]

[project.scripts]
githubguardian = "guardian.cli:main"
