services:
  - type: web
    name: github-guardian
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false
      - key: GUARDIAN_SCHEDULE_TOKEN
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: GUARDIAN_DB
        value: /app/data/guardian.db
