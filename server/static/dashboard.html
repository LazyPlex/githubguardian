<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Guardian Dashboard</title><style>body{font-family:system-ui;max-width:1200px;margin:40px auto;padding:20px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px;text-align:left}button{padding:8px 12px}</style></head><body><h1>Security Dashboard</h1><button onclick="addRepo()">Add repository</button> <button onclick="addAlert()">Configure alert</button><table><thead><tr><th>Repository</th><th>Severity</th><th>Detector</th><th>File</th><th>Line</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table><script>
async function load(){const r=await fetch('/api/findings');if(!r.ok){location='/';return}const d=await r.json(),body=document.getElementById('rows');body.innerHTML='';d.findings.forEach(f=>{const tr=document.createElement('tr');[f.full_name,f.severity,f.detector,f.path,f.line,f.status].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});const td=document.createElement('td');['acknowledged','resolved'].forEach(s=>{const b=document.createElement('button');b.textContent=s;b.onclick=async()=>{await fetch('/api/findings/'+f.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});load()};td.appendChild(b)});tr.appendChild(td);body.appendChild(tr)})}
async function addRepo(){const repository=prompt('GitHub repository owner/name');if(!repository)return;const r=await fetch('/api/repos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repository})});if(!r.ok)alert(await r.text());setTimeout(load,1000)}
async function addAlert(){const kind=prompt('Alert type: slack or email');const target=prompt('Webhook URL for the selected alert type');if(!kind||!target)return;const r=await fetch('/api/alerts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,target})});if(!r.ok)alert(await r.text())}
load();
</script></body></html>
