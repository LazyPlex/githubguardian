name: GitHub Guardian PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GitHub Guardian
        run: pip install .
      - name: Scan pull request diff
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          githubguardian "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}" --fail-on high
