name: GitHub Guardian PR Scan

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request number to scan
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GitHub Guardian
        run: pip install .
      - name: Scan selected pull request diff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: githubguardian "${{ github.repository }}" --pr "$PR_NUMBER" --fail-on high
