name: GitHub Guardian PR Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GitHub Guardian
        run: pip install .
      - name: Scan pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          githubguardian "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}" --sarif guardian.sarif --fail-on high
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: guardian.sarif
