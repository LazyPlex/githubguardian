name: SaaS Checks

on:
  push:
    paths:
      - "server/**"
      - "requirements-saas.txt"
      - "Dockerfile"
  pull_request:
    paths:
      - "server/**"
      - "requirements-saas.txt"
      - "Dockerfile"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-saas.txt
      - run: python -m compileall guardian server
