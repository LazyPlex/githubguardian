name: Feature request
description: Suggest a safe improvement to GitHub Guardian
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the proposed behavior and any safety considerations.
    validations:
      required: true
